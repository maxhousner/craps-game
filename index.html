<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Craps</title>
  <meta name="description" content="Casino-accurate craps: every bet, Vegas house rules, exact odds.">
  <meta name="theme-color" content="#0d1013">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%23d32f2f'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='10' cy='10' r='2.6'/%3E%3Ccircle cx='16' cy='16' r='2.6'/%3E%3Ccircle cx='22' cy='22' r='2.6'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><span class="brand-die" aria-hidden="true"></span><span class="brand-name">Craps</span></h1>
    <div class="meters">
      <div class="meter"><span>Bankroll</span><strong id="bankroll">$0</strong></div>
      <div class="meter hide-sm"><span>On table</span><strong id="on-table">$0</strong></div>
      <div class="meter"><span>Session</span><strong id="session">$0</strong></div>
      <div class="meter point"><span>Point</span><strong id="point-label">OFF</strong></div>
    </div>
    <a class="icon-btn help-link" href="help.html" aria-label="How to play and what every bet means">?</a>
    <button id="open-settings" class="icon-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <main class="layout">
    <section class="status" aria-label="Last roll">
      <div class="dice idle" id="dice"></div>
      <div class="call" aria-live="polite">
        <p id="call">Place your bets. Pick a chip, tap a spot, then roll.</p>
        <p><span id="roll-net" class="net"></span> <span id="roll-detail" class="detail"></span></p>
      </div>
      <ol id="history" class="history" aria-label="Recent rolls, newest first"></ol>
    </section>

    <div class="col-main">
    <section class="felt" id="felt" aria-label="Craps table"></section>

    <nav class="mobile-tabs" aria-label="Panels">
      <button data-sheet="props">Center Props</button>
      <button data-sheet="bets">My Bets <span id="bet-count"></span></button>
    </nav>

    <section class="bets-panel sheet" id="bets" aria-label="My bets">
      <div class="sheet-head">
        <h2>My Bets <small>on table <span id="bets-on-table">$0</span></small></h2>
        <button class="icon-btn sheet-close" data-close aria-label="Close">✕</button>
      </div>
      <div id="bet-list"></div>
      <p class="tip">Tip: long-press (phone) or right-click (computer) any spot for more options, like buy, lay and put.</p>
    </section>
    </div>

    <div class="col-side">
    <aside class="props sheet" id="props" aria-label="Center action and side bets"></aside>
    <section class="stats-panel" id="stats" aria-label="Session stats"></section>
    </div>
  </main>

  <footer class="dock" id="dock">
    <div id="issues" class="issues" hidden></div>
    <div class="dock-row">
      <div class="rack" id="chip-rack" role="radiogroup" aria-label="Chip value"></div>
      <div class="dock-actions">
        <button id="undo" class="ghost">Undo</button>
        <button id="take-down" class="ghost">Take down</button>
        <button id="roll" class="roll-btn">Roll</button>
      </div>
    </div>
    <div id="dev" class="dev" hidden></div>
  </footer>

  <div id="backdrop" class="backdrop" data-close hidden></div>
  <div id="spot-menu" class="spot-menu" role="dialog" aria-label="Bet options" hidden></div>
  <dialog id="settings" aria-label="Settings"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
